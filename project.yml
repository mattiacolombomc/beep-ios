name: Beep
options:
  bundleIdPrefix: com.mattiacolombo
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions: [en, it]
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: M9YL94W837
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "8"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Beep:
    type: application
    platform: iOS
    sources:
      - path: Beep
      - path: NOTICE
        buildPhase: resources
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Beep AppStore"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattiacolombo.Beep
        PRODUCT_NAME: Beep
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Beep/Resources/Info.plist
      properties:
        CFBundleDisplayName: Beep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.mattiacolombo.Beep.refresh]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        CFBundleURLTypes:
          - CFBundleURLName: com.mattiacolombo.Beep
            CFBundleURLSchemes: [beep]
        CoreSpotlightContinuation: true
    entitlements:
      path: Beep/Beep.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mattiacolombo.Beep]
    dependencies:
      - target: BeepWidget
        embed: true
    scheme:
      testTargets:
        - BeepTests
      gatherCoverageData: true
  BeepWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BeepWidget
      - path: Beep/Store/Models.swift
      - path: Beep/Store/StoreContainer.swift
      - path: Beep/MoodleKit/AcademicYear.swift
      - path: Beep/Design/Theme.swift
      - path: Beep/App/AppRouter.swift
      - path: Beep/Resources/Assets.xcassets
    entitlements:
      path: BeepWidget/BeepWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mattiacolombo.Beep]
    info:
      path: BeepWidget/Info.plist
      properties:
        CFBundleDisplayName: Beep
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Beep Widget AppStore"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattiacolombo.Beep.BeepWidget
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
  BeepMac:
    type: application
    platform: macOS
    sources:
      - path: Beep
        excludes:
          - App/AppDelegate.swift
          - App/BeepApp.swift
          - App/MainTabs.swift
          - Sync/BackgroundRefresh.swift
          - Resources/Info.plist
      - path: BeepMac
      - path: NOTICE
        buildPhase: resources
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Beep Mac AppStore"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattiacolombo.Beep
        PRODUCT_NAME: Beep
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: BeepMac/Info.plist
      properties:
        CFBundleDisplayName: Beep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Mattia Colombo"
        CFBundleURLTypes:
          - CFBundleURLName: com.mattiacolombo.Beep
            CFBundleURLSchemes: [beep]
    entitlements:
      path: BeepMac/BeepMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    scheme: {}
  BeepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BeepTests
    dependencies:
      - target: Beep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattiacolombo.BeepTests
        GENERATE_INFOPLIST_FILE: YES
